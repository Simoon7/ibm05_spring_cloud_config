# eureka 서버에게 질의하기 위해 필요하며, 모든 모듈에 공통으로 필요
eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/
server:
  # 0으로 세팅하면 spring이 임의 port를 할당(굳이 8081..등으로 관리할 필요없음)
  port: 0

spring:
  redis:
    host: localhost
    port: 6379
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3307/ordermsa?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: admin
  jpa:
    database-platform: org.hibernate.dialect.MariaDBDialect
    generate-ddl: true
    hibernate:
      ddl-auto: create
    show_sql: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    cloud:
      bus:
        enabled: true